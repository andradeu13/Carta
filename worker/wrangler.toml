# Cumbre en Cloudflare Workers: sirve la app (../app) y la API (/api/*), y revisa cada minuto qué preguntar por push.
name = "cumbre"
main = "src/index.js"
compatibility_date = "2026-10-01"

# La app (../app) va empaquetada dentro de la Worker (src/static.js, generado por `npm run build`).

[[kv_namespaces]]
binding = "CUMBRE"
id = "249549bba6544864981046fdeaabd1ef"

[triggers]
crons = ["* * * * *"]

[vars]
TZ = "America/Guayaquil"
# Pega aquí la clave pública que imprime `npm run vapid` y la dirección de tu sitio (NO tu correo).
VAPID_PUBLIC_KEY = "BEtE3YiAGEy69sMgor3ELexqWYC2VK8Q0CfcYym5ZrJTOKZOp-z5Jxft3lqNJRvS1mbKjbq-x3ARio-cCluvP2I"
VAPID_SUBJECT = "https://cumbre.isaiandrade7-ea.workers.dev"
# Secretos (no van aquí): VAPID_PRIVATE_KEY, APP_TOKEN, SIGN_SECRET → `wrangler secret put <NOMBRE>`
