# Cumbre en Cloudflare Workers: sirve la app (../app) y la API (/api/*), y revisa cada minuto qué preguntar por push.
name = "cumbre"
main = "src/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "../app"
binding = "ASSETS"
# Solo /api/* pasa por el Worker; todo lo demás lo sirve Cloudflare directamente desde los archivos estáticos.
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "CUMBRE"
id = "REEMPLAZA_CON_EL_ID_QUE_DEVUELVE_wrangler_kv_namespace_create"

[triggers]
crons = ["* * * * *"]

[vars]
TZ = "America/Guayaquil"
# Pega aquí la clave pública que imprime `npm run vapid` y la dirección de tu sitio (NO tu correo).
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "https://cumbre.TU-SUBDOMINIO.workers.dev"
# Secretos (no van aquí): VAPID_PRIVATE_KEY, APP_TOKEN, SIGN_SECRET → `wrangler secret put <NOMBRE>`
