<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizarra semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
  :root{color-scheme:light;--ink:#22202B;--muted:#6A6679;--line:#E4DEF0;--violet:#6A47F5;--green:#168F68;--bg:#F1EEF6;--lilac:#E4DBFF;--peach:#FFE0CC;--mint:#CFF3E2;--sky:#D3E8FF;--butter:#FFEFB0;--pink:#FFD9E4}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font:14px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;margin:0;padding:20px;color:var(--ink);background:var(--bg)}
  h1{margin:0;font:800 24px/1.2 Outfit,"Plus Jakarta Sans",sans-serif} h2{font:800 13px/1.2 Outfit,"Plus Jakarta Sans",sans-serif;margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  button{font:800 14px "Plus Jakarta Sans",sans-serif;padding:11px 20px;border-radius:999px;border:0;background:#FFC83D;color:var(--ink);cursor:pointer;box-shadow:0 8px 18px rgba(255,176,32,.38)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .col{border-radius:20px;padding:10px;min-height:170px;background:var(--c,#fff);box-shadow:0 6px 20px rgba(60,40,120,.08)}
  .col:nth-child(7n+1){--c:var(--lilac)} .col:nth-child(7n+2){--c:var(--peach)} .col:nth-child(7n+3){--c:var(--mint)} .col:nth-child(7n+4){--c:var(--sky)} .col:nth-child(7n+5){--c:var(--butter)} .col:nth-child(7n+6){--c:var(--pink)} .col:nth-child(7n+7){--c:#fff}
  .col h2{border-bottom:1.5px solid rgba(34,32,43,.15);padding-bottom:5px}
  .col h3{margin:8px 0 2px;font:800 10px "Plus Jakarta Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .t{display:flex;gap:6px;margin:5px 0;font-size:12px;font-weight:600}
  .box{width:14px;height:14px;border:2px solid var(--ink);border-radius:5px;flex:none;margin-top:1px;background:#fff}
  .box.on{background:var(--green);border-color:var(--green)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .card{border-radius:20px;padding:14px;background:#fff;box-shadow:0 6px 20px rgba(60,40,120,.08)}
  .chain{display:flex;flex-wrap:wrap;gap:5px}
  .chain .box{width:19px;height:19px}
  table{width:100%;border-collapse:collapse;font-size:12px} td,th{border-bottom:1px solid var(--line);padding:5px 3px;text-align:center;font-weight:700}
  .stage{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:12px}
  small{color:var(--muted);font-weight:600}
  @media print{ @page{margin:10mm} .noprint{display:none} body{padding:0;font-size:11px;background:#fff} h1{font-size:18px} .bar{margin-bottom:8px} .col{min-height:90px;box-shadow:none} .card{box-shadow:none;border:1px solid var(--line)} .t{font-size:10.5px;margin:3px 0} .row{margin-top:8px;grid-template-columns:2fr 1fr} .row+.row{grid-template-columns:1fr 2fr} }
</style>
</head>
<body>
<div class="bar"><h1 id="ttl">Pizarra semanal</h1><button class="noprint" onclick="window.print()">Imprimir</button></div>
<div id="out"></div>
<script>
(function(){
  var D=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var pad=function(n){return String(n).padStart(2,'0')};
  var fmt=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  var S=null; try{S=JSON.parse(localStorage.getItem('coach.v1'))}catch(e){}
  S=S||{xp:0,days:{},plan:null,history:{}};
  var now=new Date(); var mon=new Date(now); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); mon.setHours(0,0,0,0);
  var key=fmt(mon);
  var plan=(S.plan&&S.plan.weekStart===key)?S.plan:(S.history&&S.history[key])||null;
  // Si es domingo y hay plan de la próxima semana, se imprime ese.
  if(now.getDay()===0&&S.plan&&S.plan.weekStart>key){plan=S.plan;mon=new Date(mon);mon.setDate(mon.getDate()+7);}
  var end=new Date(mon); end.setDate(end.getDate()+6);
  document.getElementById('ttl').textContent='Pizarra · semana del '+mon.getDate()+'/'+(mon.getMonth()+1)+' al '+end.getDate()+'/'+(end.getMonth()+1);
  var h='';
  h+='<div class="grid">';
  for(var d=0;d<7;d++){
    var ts=(plan?plan.tasks:[]).filter(function(t){return t.day===d}).sort(function(x,y){return (x.ord==null?1e6:x.ord)-(y.ord==null?1e6:y.ord)});
    var grp=function(blk,lab){var l=ts.filter(function(t){return (t.block==='am'?'am':'pm')===blk});return l.length?'<h3>'+lab+'</h3>'+l.map(function(t){return '<div class="t"><span class="box '+(t.done?'on':'')+'"></span><span>'+esc(t.title)+'</span></div>'}).join(''):''};
    h+='<div class="col"><h2>'+D[d]+'</h2>'+grp('am','Mañana')+grp('pm','Noche')+'</div>';
  }
  h+='</div>';
  // hábitos P1 por día
  var rows=[['Dormir a la hora','sleep'],['Redes en el límite','redes'],['Meditación','med'],['Salmo','salmo'],['Trote','trote']];
  h+='<div class="row"><div class="card"><h2>Hábitos de la semana</h2><table><tr><th></th>'+D.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>';
  rows.forEach(function(r){h+='<tr><td style="text-align:left">'+r[0]+'</td>'+D.map(function(_,i){var dd=new Date(mon);dd.setDate(dd.getDate()+i);var rec=S.days[fmt(dd)];return '<td>'+((rec&&rec.habits&&rec.habits[r[1]])?'■':'□')+'</td>'}).join('')+'</tr>'});
  h+='</table></div>';
  // racha: 28 casillas
  var chain='';for(var i=27;i>=0;i--){var dd=new Date(now);dd.setHours(0,0,0,0);dd.setDate(dd.getDate()-i);var r=S.days[fmt(dd)];var ok=r&&(Object.keys(r.habits||{}).length+(r.tasksDone||0))>=2;chain+='<span class="box '+(ok?'on':'')+'"></span>'}
  h+='<div class="card"><h2>Racha (últimos 28 días)</h2><div class="chain">'+chain+'</div><p style="margin:8px 0 0">XP total: <b>'+(S.xp||0)+'</b></p></div></div>';
  // metas del año
  var goals=Object.keys(S.goals||{}).map(function(k){return S.goals[k]}).filter(function(g){return g&&!g.deleted}).sort(function(a,b){return String(a.due||'9999').localeCompare(String(b.due||'9999'))}).slice(0,7);
  var pctG=function(g){if(g.done)return 100;var m=g.milestones||[];if(m.length)return Math.round(100*m.filter(function(x){return x.done}).length/m.length);if(g.target&&+g.target.value>0)return Math.min(100,Math.round(100*(+g.target.current||0)/+g.target.value));return 0};
  h+='<div class="row"><div class="card"><h2>Metas del año (marca los hitos)</h2>'+(goals.length?goals.map(function(g){var ms=g.milestones||[];return '<div class="stage"><span class="box '+(pctG(g)===100?'on':'')+'"></span><b>'+esc(g.title)+'</b> <small>· '+pctG(g)+'%'+(g.due?' · '+esc(g.due):'')+'</small></div>'+ms.map(function(m){return '<div class="stage" style="margin-left:18px"><span class="box '+(m.done?'on':'')+'"></span>'+esc(m.t)+'</div>'}).join('')}).join(''):'<p>Crea tus metas en la app (pestaña Metas) y vuelve a abrir esta hoja.</p>')+'</div>';
  if(!plan)h+='<p class="noprint">Aún no hay plan para esta semana. Créalo en la app (pestaña Semana) y vuelve a abrir esta hoja.</p>';
  document.getElementById('out').innerHTML=h;
})();
</script>
</body>
</html>
